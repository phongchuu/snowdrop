---
name: Snowdrop

volumes:
  postgres-data:

networks:
  backend:

configs:
  pgpass:
    content: ${SNOWDROP_DB_ADMIN_USER}
  servers.json:
    content: |
      {
        "Servers": {
          "1": {
            "Group": "Servers",
            "Name": "${SNOWDROP_DB_NAME}",
            "Host": "database",
            "Port": 5432,
            "MaintenanceDB": "${SNOWDROP_DB_NAME}",
            "Username": "${SNOWDROP_DB_ADMIN_USER}",
            "PassFile": "/pgpass",
            "SSLMode": "prefer"
          }
        }
      }

services:
  database:
    container_name: database
    image: postgres:17.5-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DB_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DB_SUPER_PASSWORD}
      SNOWDROP_DB_NAME: ${SNOWDROP_DB_NAME}
      SNOWDROP_DB_ADMIN_USER: ${SNOWDROP_DB_ADMIN_USER}
      SNOWDROP_DB_ADMIN_PASSWORD: ${SNOWDROP_DB_ADMIN_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./.docker/database/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - ${POSTGRES_DB_FORWARD_PORT}:5432
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:9.3.0
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - ${PGADMIN_FORWARD_PORT}:80
    configs:
      - source: servers.json
        target: /pgadmin4/servers.json
      - source: pgpass
        target: /pgpass
    networks:
      - backend

  grafana-otel-lgtm:
    image: grafana/otel-lgtm:0.11.4
    restart: always
    ports:
      - 5000:3000
      - 4317:4317
      - 4318:4318
    networks:
      - backend
