---
language: en-US
tone_instructions: ""
early_access: false
enable_free_tier: true
auto_resolve_threads: true
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: |
    1. Start with a Specific Verb
      - Use action words like "Add", "Fix", "Update", or "Remove" to indicate the change.
      - Example: "Add email validation to signup form".

    2. Describe the Affected Object or Component
      - Specify the part of the code or feature being modified.
      - Example: "Fix button styling in header navigation component".

    3. Add Brief Details About the Change
      - Include a short description (under 10 words) of what's being done.
      - Example: "Update API endpoint to handle timeout errors".

    4. Use Reference Numbers If Available
      - Add issue or ticket numbers like "BUG-123" for context.
      - Example: "Remove unused CSS classes from styles (DES-456)".

    5. Ensure Title Length is 50-80 Characters
      - Keep the title between 50 and 80 characters for readability.
      - Example: "Add user authentication middleware to login flow" (50 characters).

    6. Capitalize the First Letter
      - Begin with a capital letter, keep the rest lowercase.
      - Example: "Fix login error message display on mobile devices".

    7. Use Present Tense
      - Write as if the action is happening now, not past or future.
      - Example: "Add loading spinner to checkout page for better UX".

    8. Check If the Title is Easy to Understand
      - Ensure it's clear to someone unfamiliar with the code.
      - Example: "Update database schema to include user profile fields".

    9. Indicate Breaking Changes
      - Add "[BREAKING]" if the change breaks existing functionality.
      - Example: "[BREAKING] Remove support for Python 2.7 in backend".

    10. Use Relevant Keywords
        - Include searchable terms for future reference.
        - Example: "Implement caching mechanism for API request performance".

    11. Avoid Special Characters
        - Skip symbols like #, @, $, etc., unless required, to avoid issues.
        - Example: "Fix issue 123 in payment module" (not "Fix issue#123").
  review_status: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  suggested_reviewers: true
  auto_assign_reviewers: true
  poem: false
  labeling_instructions:
    - label: blocked
      instructions: Assign to a PR that cannot proceed due to an external dependency, such as another PR, an upstream issue, or a third-party library update.
    - label: needs clarification
      instructions: Assign to a PR where the description or changes are unclear and require more details from the author before review can proceed.
    - label: waiting for maintainer
      instructions: Assign to a PR that is complete but awaiting a maintainer's review, approval, or merge action.
    - label: bug
      instructions: Do not assign to PRs. This label is for issues reporting errors or unexpected behavior. Use 'fix' for PRs addressing bugs.
    - label: discussion
      instructions: Do not assign to PRs. This label is for issues involving general discussions. Use comments in the PR for discussions.
    - label: documentation
      instructions: Assign to a PR that updates, improves, or adds documentation, such as README files, API docs, or user guides.
    - label: duplicate
      instructions: Assign to a PR that duplicates another PR's changes or purpose. Link the duplicated PR in the comments.
    - label: enhancement
      instructions: Assign to a PR that improves an existing feature, such as optimizing performance or enhancing user experience, without adding new functionality.
    - label: feature
      instructions: Assign to a PR that implements a new feature or functionality in the codebase.
    - label: fix
      instructions: Assign to a PR that resolves a reported bug or fixes unexpected behavior in the codebase.
    - label: invalid
      instructions: Assign to a PR that is not valid, such as one based on incorrect assumptions, or does not align with project goals.
    - label: needs testcase
      instructions: Assign to a PR that is missing unit tests or integration tests required to validate the changes.
    - label: question
      instructions: Do not assign to PRs. This label is for issues asking questions about the project. Use comments in the PR for clarifications.
    - label: regression
      instructions: Assign to a PR that fixes a bug causing a previously working feature to break, often introduced by a recent change.
    - label: security
      instructions: Assign to a PR that addresses a security vulnerability, such as patching an exploit or fixing a data leak.
    - label: wontfix
      instructions: Assign to a PR that the team decides not to merge, often because it does not align with project goals or is too complex to implement.
  path_filters: []
  path_instructions: []
  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords: []
    labels: []
    drafts: false
    base_branches: []
  finishing_touches:
    docstrings:
      enabled: true
  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      enabled_only: false
      level: default
    biome:
      enabled: true
    hadolint:
      enabled: true
    swiftlint:
      enabled: true
    phpstan:
      enabled: true
      level: default
    golangci-lint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    checkov:
      enabled: true
    detekt:
      enabled: true
    eslint:
      enabled: true
    rubocop:
      enabled: true
    buf:
      enabled: true
    regal:
      enabled: true
    actionlint:
      enabled: true
    pmd:
      enabled: true
    cppcheck:
      enabled: true
    semgrep:
      enabled: true
    circleci:
      enabled: true
chat:
  auto_reply: true
  create_issues: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto
knowledge_base:
