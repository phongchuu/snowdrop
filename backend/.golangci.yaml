---
version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - tagalign
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - cyclop
    - decorder
    - dupl
    - durationcheck
    - dogsled
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - intrange
    - ireturn
    - lll
    - makezero
    - mirror
    # - mnd
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - testpackage
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wsl
    - err113
    - exptostd
    - forcetypeassert
    - gochecknoglobals
    - iface
    - inamedparam
    - interfacebloat
    # - maintidx
    - misspell
    - nilnesserr
    - nlreturn
    - paralleltest
    - recvcheck
    # - wrapcheck
    - contextcheck
  settings:
    # maintidx:
    #   under: 65
    tagalign:
      strict: true
      align: true
      sort: true
      order:
        - json
        - yaml
        - yml
        - toml
        - mapstructure
        - binding
        - validate
    cyclop:
      max-complexity: 30
      package-average: 10
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      disable-dec-num-check: true
      disable-type-dec-num-check: true
      disable-const-dec-num-check: true
      disable-var-dec-num-check: true
      disable-dec-order-check: false
      disable-init-func-first-check: true
    errcheck:
      check-type-assertions: true
    exhaustive:
      check:
        - switch
        - map
    funlen:
      lines: 100
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 20
    gomoddirectives:
      replace-local: true
    govet:
      disable:
        - fieldalignment
      enable-all: true
    ireturn:
      allow:
        - empty
        - error
        - stdlib
        - anon
        - generic
        - fx.Option
        - universal-translator.Translator
    lll:
      line-length: 120
      tab-width: 1
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - funlen
        - gocognit
        - lll
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      no-global: all
      context: scope
      key-naming-case: kebab
      forbidden-keys:
        - time
        - level
        - source
        - msg
      args-on-sep-lines: true
    staticcheck:
      checks:
        - -ST1001
        - all
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - linter
    - severity
    - file
  show-stats: true
