---
"200": Your request was successfully completed.
"201": The resource has been successfully created on the server.
"202": Your request has been accepted and is awaiting processing.
"400": The request contains invalid parameters or is malformed.
"401": Authentication is required to proceed with this request.
"403": You do not have permission to access this resource.
"404": The resource you requested could not be found on the server.
"405": The requested method is not allowed for this resource. Please check the allowed methods and try again.
"408": The server timed out waiting for your request; please try again.
"500": An internal server error occurred; please try again later.
"501": The server does not currently support this functionality.
"502": The server received an invalid response from another server.
"503": The service is currently unavailable; please try again later.
"504": The server did not receive a timely response from another server.

### features/Auth
Auth:
  InvalidCredentials: Invalid username or password.
