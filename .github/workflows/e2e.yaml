---
name: E2E

"on":
  pull_request:
    paths: [e2e/**]
  push:
    paths: [e2e/**]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  e2e:
    name: End-to-End Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.2
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci
      - name: Run E2E linter
        working-directory: e2e
        run: npm run lint
      - name: Check E2E code formatting
        working-directory: e2e
        run: npm run prettier::check
      - name: Run E2E type checks
        working-directory: e2e
        run: npm run typecheck
      - name: Start database and supporting services
        env:
          POSTGRES_DB_SUPER_USER: root
          POSTGRES_DB_SUPER_PASSWORD: Keep!t5ecret
          SNOWDROP_DB_NAME: snowdrop
          SNOWDROP_DB_ADMIN_USER: admin
          SNOWDROP_DB_ADMIN_PASSWORD: Keep!t5ecret
          APP_DB_HOST: database
          APP_DB_PORT: 5432
          APP_DB_NAME: snowdrop
          APP_DB_USERNAME: admin
          APP_DB_PASSWORD: Keep!t5ecret
          APP_DEFAULT_SYSTEM_PASSWORD: Keep!t5ecret
          OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-otel-lgtm:4317
        run: docker compose -f compose.ci.yaml up -d
      - name: Install browser dependencies
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
